<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>Surprise For You!</title>

  <style>
    * { padding: 0; margin: 0; box-sizing: border-box; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #fae6e9; font-family: "Quicksand", sans-serif; overflow: hidden; }
    .question-container { display: flex; flex-direction: column; align-items: center; text-align: center; z-index: 10; padding: 0 15px;}
    .local-gif { width: 250px; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; pointer-events: none; background-color: transparent; }
    .question { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 700; color: #111; margin-bottom: 25px; letter-spacing: -0.5px; word-break: break-word;}
    .button-container { display: flex; gap: 20px; justify-content: center; align-items: center; }
    .btn { border: none; border-radius: 50px; padding: 10px 32px; font-family: "Quicksand", sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; background-color: #ef6e7e; color: white; box-shadow: 0px 8px 15px rgba(239, 110, 126, 0.35); transition: transform 0.2s ease, background-color 0.2s ease; }
    .btn:hover { background-color: #df5869; transform: scale(1.05); }
    .no-btn { transition: top 0.2s ease, left 0.2s ease; }
    
    .result-container { display: none; flex-direction: column; align-items: center; text-align: center; z-index: 10; padding: 0 15px;}
    .gif-result { width: 250px; height: 250px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
    .result-container h2 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; color: #111; word-break: break-word;}

    /* Heart Loader */
    .cssload-main { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; }
    .cssload-main * { font-size: 62px; }
    .cssload-heart { animation: cssload-heart 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; top: 50%; left: 50%; position: absolute; }
    .cssload-heartL, .cssload-heartR, .cssload-square { width: 1em; height: 1em; background-color: #ff0000; border: 1px solid #ff0000; position: absolute; display: block; }
    .cssload-heartL { border-radius: 100%; transform: translate(-28px, -27px); animation: cssload-heartL 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-heartR { border-radius: 100%; transform: translate(28px, -27px); animation: cssload-heartR 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-square { transform: scale(1) rotate(-45deg); animation: cssload-square 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-shadow { top: 97px; left: 50%; position: relative; display: block; width: 1em; height: 0.24em; background-color: rgb(215, 215, 215); border-radius: 50%; transform: translateX(-50%); animation: cssload-shadow 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }

    @keyframes cssload-square { 50% { border-radius: 100%; transform: scale(0.5) rotate(-45deg); } 100% { transform: scale(1) rotate(-45deg); } }
    @keyframes cssload-heart { 50% { transform: rotate(360deg); } 100% { transform: rotate(720deg); } }
    @keyframes cssload-heartL { 60% { transform: scale(0.4) translate(-28px, -27px); } }
    @keyframes cssload-heartR { 40% { transform: scale(0.4) translate(28px, -27px); } }
    @keyframes cssload-shadow { 50% { transform: translateX(-50%) scale(0.5); } }
  </style>
</head>
<body>

  <!-- Main Question UI -->
  <div class="question-container js-question-container">
    <img class="local-gif" src="https://media.tenor.com/hlr3kptkdu4AAAAj/bubu-dudu.gif" alt="Cute Bears">
    
    <!-- ID added for dynamic text -->
    <h2 class="question" id="dynamic-question">या तुम मेरे दोस्त बनोगे?</h2>
    
    <div class="button-container">
      <button class="btn yes-btn js-yes-btn">Yes</button>
      <button class="btn no-btn js-no-btn">No</button>
    </div>
  </div>
  
  <!-- Success UI -->
  <div class="result-container js-result-container">
    <img class="gif-result" src="https://media.tenor.com/uK14vJSZ2zMAAAAi/wow.gif" alt="Happy Bears">
    <!-- ID added for dynamic text -->
    <h2 id="dynamic-success">Hehehe...बन गए ना मेरे दोस्त 😁😂😍!</h2>
  </div>

  <!-- Loading Animation -->
  <div class="cssload-main js-cssload-main">
    <div class="cssload-heart">
      <span class="cssload-heartL"></span>
      <span class="cssload-heartR"></span>
      <span class="cssload-square"></span>
    </div>
    <div class="cssload-shadow"></div>
  </div>

  <script>
    // URL se Data Extract karna
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('d');
        
        if (dataParam) {
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
                if(decoded.q) document.getElementById('dynamic-question').innerText = decoded.q;
                if(decoded.s) document.getElementById('dynamic-success').innerText = decoded.s;
            } catch(e) {
                console.log("Error decoding link data:", e);
            }
        }
    };

    const questionContainer = document.querySelector(".js-question-container");
    const resultContainer = document.querySelector(".js-result-container");
    const heartLoader = document.querySelector(".js-cssload-main");
    const yesBtn = document.querySelector(".js-yes-btn");
    const noBtn = document.querySelector(".js-no-btn");

    const moveNoBtn = () => {
      noBtn.style.position = 'fixed';
      
      const maxX = window.innerWidth - noBtn.offsetWidth - 20; 
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      
      const newX = Math.max(20, Math.floor(Math.random() * maxX));
      const newY = Math.max(20, Math.floor(Math.random() * maxY));

      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    };

    noBtn.addEventListener("mouseover", moveNoBtn);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault(); 
      moveNoBtn();
    });

    yesBtn.addEventListener("click", () => {
      questionContainer.style.display = "none";
      heartLoader.style.display = "block";

      setTimeout(() => {
        heartLoader.style.display = "none";
        resultContainer.style.display = "flex"; 
      }, 3000);
    });
  </script>

</body>
</html>
