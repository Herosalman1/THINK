<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Quicksand", sans-serif; }
        body { background-color: #fae6e9; color: #111; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(239, 110, 126, 0.2); }
        h2 { text-align: center; color: #ef6e7e; margin-bottom: 20px; font-weight: 700; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 2px solid #fbd9de; background: #fff; color: #111; font-size: 1rem; outline: none; }
        input:focus, textarea:focus { border-color: #ef6e7e; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; background: #ef6e7e; border: none; padding: 15px; border-radius: 50px; color: white; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-bottom: 15px; box-shadow: 0px 8px 15px rgba(239, 110, 126, 0.35); }
        button:hover { background-color: #df5869; transform: scale(1.02); }
        .result-box { display: none; background: #fdf2f4; padding: 15px; border-radius: 8px; margin-top: 10px; word-break: break-all; font-size: 0.85rem; border: 1px dashed #ef6e7e; }
        .result-title { font-size: 0.9rem; color: #ef6e7e; margin-bottom: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Link Generator 🐻</h2>
        
        <label>Main Question (Sawal):</label>
        <input type="text" id="questionText" placeholder="e.g. या तुम मेरे दोस्त बनोगे?" autocomplete="off">
        
        <label>Success Message (Jab wo Yes dabaye):</label>
        <textarea id="successText" placeholder="e.g. Hehehe...बन गए ना मेरे दोस्त 😁😂😍!"></textarea>
        
        <button onclick="generateLink()">Generate Link 🔗</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">Ye link copy karein aur WhatsApp par bhejein:</div>
            <p id="generatedUrl" style="margin-bottom: 15px; font-weight: 500;"></p>
            <button onclick="copyLink()" style="padding: 10px; font-size: 0.9rem;">Copy Link 📋</button>
        </div>
    </div>

    <script>
        function generateLink() {
            const q = document.getElementById('questionText').value.trim();
            const s = document.getElementById('successText').value.trim();
            
            if(!q || !s) {
                alert("Please enter both Question and Success Message!");
                return;
            }

            // Data ko encode karna
            const payload = { q: q, s: s };
            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            
            // Current URL se index.html hatakar surprise.html lagana
            let baseUrl = window.location.href.split('?')[0];
            baseUrl = baseUrl.replace('index.html', '');
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            const finalLink = `${baseUrl}surprise.html?d=${encodedData}`;
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("Link Copied! Now send it to your friend.");
            });
        }
    </script>
</body>
</html>
