<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>Prank Link Generator</title>

  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    /* --- ORIGINAL BACKGROUND THEME HAMESHA KE LIYE --- */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fae6e9; /* Exact original color */
      font-family: "Quicksand", sans-serif;
      overflow: hidden;
    }

    /* =========================================
       1. PREMIUM GENERATOR UI (White Box)
       ========================================= */
    #generator-ui { 
        background: #ffffff; 
        padding: 40px 35px; 
        border-radius: 24px; 
        width: 90%; 
        max-width: 480px; 
        box-shadow: 0 15px 35px rgba(239, 110, 126, 0.15); 
        z-index: 100; 
    }
    #generator-ui h2 { 
        text-align: center; color: #ef6e7e; margin-bottom: 30px; font-weight: 700; font-size: 1.8rem;
    }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a4a4a; font-size: 0.95rem; }
    .input-group input { 
        width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid #fbd9de; 
        background: #fdf2f4; color: #111; font-size: 1rem; font-weight: 500; outline: none; 
    }
    .input-group input:focus { border-color: #ef6e7e; background: #fff; }
    
    #generateBtn { 
        width: 100%; background: #ef6e7e; border: none; padding: 16px; border-radius: 14px; 
        color: white; font-weight: 700; font-size: 1.1rem; cursor: pointer; margin-top: 10px; margin-bottom: 15px; 
    }
    #generateBtn:hover { background-color: #df5869; }
    
    .result-box { 
        display: none; background: #fff0f3; padding: 20px; border-radius: 16px; 
        margin-top: 15px; word-break: break-all; font-size: 0.9rem; border: 1.5px dashed #ffb3c6;
    }
    #copyBtn {
        background: #ef6e7e; color: white; border: none; padding: 12px; width: 100%;
        border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }

    /* =========================================
       2. ORIGINAL PRANK UI EXACT CSS 
       ========================================= */
    .question-container {
      display: none; /* Hidden by default */
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .local-gif {
      width: 250px; 
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
      pointer-events: none;
      background-color: transparent; 
    }

    .question {
      font-size: 2.8rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 25px;
      letter-spacing: -0.5px;
    }

    .button-container {
      display: flex;
      gap: 20px; 
      justify-content: center;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 50px; 
      padding: 10px 32px;
      font-family: "Quicksand", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background-color: #ef6e7e; 
      color: white;
      box-shadow: 0px 8px 15px rgba(239, 110, 126, 0.35); 
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #df5869;
      transform: scale(1.05);
    }

    .no-btn {
      transition: top 0.2s ease, left 0.2s ease; 
    }

    .result-container {
      display: none; /* Hidden by default */
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .gif-result {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .result-container h2 {
      font-size: 3rem;
      font-weight: 700;
      color: #111;
    }

    /* --- Heart Loader --- */
    .cssload-main {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
    }

    .cssload-main * { font-size: 62px; }
    .cssload-heart { animation: cssload-heart 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; top: 50%; left: 50%; position: absolute; }
    .cssload-heartL, .cssload-heartR, .cssload-square { width: 1em; height: 1em; background-color: #ff0000; border: 1px solid #ff0000; position: absolute; display: block; }
    .cssload-heartL { border-radius: 100%; transform: translate(-28px, -27px); animation: cssload-heartL 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-heartR { border-radius: 100%; transform: translate(28px, -27px); animation: cssload-heartR 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-square { transform: scale(1) rotate(-45deg); animation: cssload-square 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    .cssload-shadow { top: 97px; left: 50%; position: relative; display: block; width: 1em; height: 0.24em; background-color: rgb(215, 215, 215); border-radius: 50%; transform: translateX(-50%); animation: cssload-shadow 2.88s cubic-bezier(0.75, 0, 0.5, 1) infinite normal; }
    @keyframes cssload-square { 50% { border-radius: 100%; transform: scale(0.5) rotate(-45deg); } 100% { transform: scale(1) rotate(-45deg); } }
    @keyframes cssload-heart { 50% { transform: rotate(360deg); } 100% { transform: rotate(720deg); } }
    @keyframes cssload-heartL { 60% { transform: scale(0.4) translate(-28px, -27px); } }
    @keyframes cssload-heartR { 40% { transform: scale(0.4) translate(28px, -27px); } }
    @keyframes cssload-shadow { 50% { transform: translateX(-50%) scale(0.5); } }

    /* =========================================
       3. CREATOR WATERMARK (Instagram Link)
       ========================================= */
    .creator-tag {
        position: fixed;
        bottom: 15px;
        right: 20px;
        font-size: 0.9rem;
        font-weight: 700;
        color: #ef6e7e;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.6);
        padding: 8px 12px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(239, 110, 126, 0.15);
        z-index: 1000;
        transition: all 0.3s ease;
    }
    .creator-tag:hover {
        background: rgba(255, 255, 255, 0.95);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(239, 110, 126, 0.3);
    }
  </style>
</head>
<body id="mainBody">

  <!-- ================= UI 1: PREMIUM LINK GENERATOR ================= -->
  <div id="generator-ui">
    <h2>Prank Link Generator</h2>
    
    <div class="input-group">
        <label>1ST MSG ✍️</label>
        <input type="text" id="qInput" value="या तुम मेरे दोस्त बनोगे?" autocomplete="off">
    </div>
    
    <div class="input-group">
        <label>2ND MSG ✍️</label>
        <input type="text" id="sInput" value="Hehehe...बन गए ना मेरे दोस्त 😁😂😍!" autocomplete="off">
    </div>
    
    <button id="generateBtn" onclick="generateLink()">✨ Generate Link</button>

    <div id="resultBox" class="result-box">
        <p style="font-weight: 700; color: #ef6e7e; margin-bottom: 8px;">Copy and Send to Friend:</p>
        <p id="generatedUrl" style="margin-bottom: 10px; font-weight: 600; color: #333;"></p>
        <button id="copyBtn" onclick="copyLink()">📋 Copy Link</button>
    </div>
  </div>

  <!-- ================= UI 2: ORIGINAL PRANK SCREEN ================= -->
  <div class="question-container js-question-container" id="prank-ui">
    <img class="local-gif" src="https://media.tenor.com/hlr3kptkdu4AAAAj/bubu-dudu.gif" alt="Cute Bears">
    <h2 class="question" id="dynamic-question">या तुम मेरे दोस्त बनोगे?</h2>
    
    <div class="button-container">
      <button class="btn yes-btn js-yes-btn">Yes</button>
      <button class="btn no-btn js-no-btn">No</button>
    </div>
  </div>
  
  <!-- ================= UI 3: ORIGINAL SUCCESS SCREEN ================= -->
  <div class="result-container js-result-container" id="success-ui">
    <img class="gif-result" src="https://media.tenor.com/uK14vJSZ2zMAAAAi/wow.gif" alt="Happy Bears">
    <h2 id="dynamic-success">Hehehe...बन गए ना मेरे दोस्त 😁😂😍!</h2>
  </div>

  <!-- ================= UI 4: ORIGINAL LOADER ================= -->
  <div class="cssload-main js-cssload-main" id="loader-ui">
    <div class="cssload-heart">
      <span class="cssload-heartL"></span>
      <span class="cssload-heartR"></span>
      <span class="cssload-square"></span>
    </div>
    <div class="cssload-shadow"></div>
  </div>

  <!-- ================= INSTAGRAM WATERMARK ================= -->
  <a href="https://www.instagram.com/herosalman1_929/" target="_blank" class="creator-tag">
      Made by :@Herosalman1
  </a>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // 1. CHECK URL FOR DATA
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('d');
        
        // Agar dost ne link khola hai
        if (dataParam) {
            // UI Hide & Show
            document.getElementById('generator-ui').style.display = 'none';
            document.getElementById('prank-ui').style.display = 'flex';
            
            try {
                const decoded = JSON.parse(decodeURIComponent(escape(atob(dataParam))));
                if(decoded.q) document.getElementById('dynamic-question').innerText = decoded.q;
                if(decoded.s) document.getElementById('dynamic-success').innerText = decoded.s;
            } catch(e) {
                console.log("Link error:", e);
            }
        }
    };

    // 2. LINK GENERATOR FUNCTION
    function generateLink() {
        const q = document.getElementById('qInput').value.trim();
        const s = document.getElementById('sInput').value.trim();
        
        if(!q || !s) { alert("Please enter both messages!"); return; }

        const payload = { q: q, s: s };
        const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        
        let baseUrl = window.location.href.split('?')[0];
        const finalLink = `${baseUrl}?d=${encodedData}`;
        
        document.getElementById('generatedUrl').innerText = finalLink;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
        const linkText = document.getElementById('generatedUrl').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✅ Copied!";
            setTimeout(() => { btn.innerText = "📋 Copy Link"; }, 2000);
        });
    }

    // 3. ORIGINAL PRANK LOGIC
    const questionContainer = document.querySelector(".js-question-container");
    const resultContainer = document.querySelector(".js-result-container");
    const heartLoader = document.querySelector(".js-cssload-main");
    const yesBtn = document.querySelector(".js-yes-btn");
    const noBtn = document.querySelector(".js-no-btn");

    const moveNoBtn = () => {
      noBtn.style.position = 'fixed';
      const maxX = window.innerWidth - noBtn.offsetWidth - 20; 
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;
      const newX = Math.max(20, Math.floor(Math.random() * maxX));
      const newY = Math.max(20, Math.floor(Math.random() * maxY));
      noBtn.style.left = `${newX}px`;
      noBtn.style.top = `${newY}px`;
    };

    noBtn.addEventListener("mouseover", moveNoBtn);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoBtn(); });

    yesBtn.addEventListener("click", () => {
      questionContainer.style.display = "none";
      heartLoader.style.display = "block";

      setTimeout(() => {
        heartLoader.style.display = "none";
        resultContainer.style.display = "flex"; 
      }, 3000);
    });
  </script>

</body>
</html>
