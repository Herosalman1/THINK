<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ सरप्राइज़ लिंक जनरेटर</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }
        body { 
            background: #fae6e9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            background: rgba(255, 245, 247, 0.8); 
            backdrop-filter: blur(10px);
            padding: 35px 30px; 
            border-radius: 30px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 20px 50px rgba(190, 90, 100, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        h2 { 
            text-align: center; 
            color: #2d1b1f; 
            margin-bottom: 25px; 
            font-size: 2rem;
        }
        .heart-icon {
            text-align: center;
            font-size: 3rem;
            animation: pulse 1.5s ease-in-out infinite;
            display: block;
            margin-bottom: 5px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
            color: #2d1b1f; 
        }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            border: 2px solid rgba(239, 110, 126, 0.3); 
            background: rgba(255, 255, 255, 0.5); 
            color: #2d1b1f; 
            font-size: 1rem; 
            font-family: 'Quicksand', sans-serif;
            transition: border 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #ef6e7e;
        }
        textarea { resize: vertical; height: 120px; }
        .btn-generate { 
            width: 100%; 
            background: #ef6e7e; 
            border: none; 
            padding: 16px; 
            border-radius: 50px; 
            color: white; 
            font-weight: 700; 
            font-size: 1.1rem;
            cursor: pointer; 
            transition: 0.3s; 
            margin-bottom: 15px;
            box-shadow: 0px 8px 25px rgba(239, 110, 126, 0.4);
        }
        .btn-generate:hover { 
            transform: translateY(-3px); 
            box-shadow: 0px 12px 35px rgba(239, 110, 126, 0.5);
            background: #df5869;
        }
        .result-box { 
            display: none; 
            background: rgba(255, 255, 255, 0.5); 
            padding: 20px; 
            border-radius: 20px; 
            margin-top: 15px; 
            border: 2px dashed #ef6e7e;
        }
        .result-title { 
            font-weight: 600; 
            color: #2d1b1f; 
            margin-bottom: 10px; 
            font-size: 0.95rem;
        }
        .generated-link {
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 12px;
            word-break: break-all;
            font-size: 0.8rem;
            color: #2d1b1f;
            margin-bottom: 15px;
            border: 1px solid rgba(239, 110, 126, 0.2);
        }
        .btn-copy { 
            width: 100%; 
            background: #b0b8c0; 
            border: none; 
            padding: 12px; 
            border-radius: 50px; 
            color: #1e1e1e; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .btn-copy:hover { 
            background: #a0aab4; 
            transform: scale(1.02);
        }
        .sub-text {
            color: #7a5a62;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="heart-icon">❤️</span>
        <h2>✨ सरप्राइज़ लिंक बनाओ ✨</h2>
        
        <label>👤 दोस्त का नाम:</label>
        <input type="text" id="friendName" placeholder="जैसे: Rahul, Priya..." autocomplete="off">
        
        <label>💝 अपना संदेश लिखो:</label>
        <textarea id="customMessage" placeholder="यहाँ अपना प्यार भरा संदेश लिखो..."></textarea>
        
        <button class="btn-generate" onclick="generateLink()">🔗 लिंक बनाओ</button>

        <div id="resultBox" class="result-box">
            <div class="result-title">📋 अपने दोस्त को ये लिंक भेजो:</div>
            <div class="generated-link" id="generatedUrl"></div>
            <button class="btn-copy" onclick="copyLink()">📋 कॉपी करो</button>
        </div>
        <div class="sub-text">💫 हर दोस्त के लिए अलग संदेश</div>
    </div>

    <script>
        function generateLink() {
            const name = document.getElementById('friendName').value.trim();
            const msg = document.getElementById('customMessage').value.trim();
            
            if(!name || !msg) {
                alert("⚠️ कृपया नाम और संदेश दोनों भरें!");
                return;
            }

            // Data ko Base64 encode karna
            const payload = { n: name, m: msg };
            const encodedData = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            
            // Current URL se index.html hatao
            let baseUrl = window.location.href.split('?')[0];
            baseUrl = baseUrl.replace('index.html', '');
            if(!baseUrl.endsWith('/')) baseUrl += '/';
            
            const finalLink = `${baseUrl}surprise.html?d=${encodedData}`;
            
            document.getElementById('generatedUrl').innerText = finalLink;
            document.getElementById('resultBox').style.display = 'block';
            
            // Scroll to result
            document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function copyLink() {
            const linkText = document.getElementById('generatedUrl').innerText;
            navigator.clipboard.writeText(linkText).then(() => {
                alert("✅ लिंक कॉपी हो गया! अब WhatsApp पर भेजो 🎉");
            }).catch(() => {
                // Fallback
                const textArea = document.createElement('textarea');
                textArea.value = linkText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("✅ लिंक कॉपी हो गया!");
            });
        }
    </script>
</body>
</html>
