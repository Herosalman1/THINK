<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>❤️ तुम्हारे लिए...</title>

  <style>
    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fae6e9;
      font-family: "Quicksand", sans-serif;
      overflow: hidden;
    }

    .question-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 10;
    }

    .local-gif {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 20px;
      pointer-events: none;
      background-color: transparent;
    }

    .question {
      font-size: 2.8rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .sub-text {
      font-size: 1.3rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.4);
      padding: 15px 30px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
    }

    .sub-text .highlight {
      color: #e0556a;
      font-weight: 700;
    }

    .btn {
      border: none;
      border-radius: 50px;
      padding: 10px 32px;
      font-family: "Quicksand", sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background-color: #ef6e7e;
      color: white;
      box-shadow: 0px 8px 15px rgba(239, 110, 126, 0.35);
      transition: transform 0.2s ease, background-color 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background-color: #df5869;
      transform: scale(1.05);
    }

    .heart-icon {
      font-size: 3.5rem;
      animation: pulse 1.5s ease-in-out infinite;
      margin-bottom: 10px;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.2);
      }
    }
  </style>
</head>
<body>

  <div class="question-container">
    <div class="heart-icon">❤️</div>

    <img class="local-gif" src="https://media.tenor.com/hlr3kptkdu4AAAAj/bubu-dudu.gif" alt="Cute Bears">

    <h2 class="question">✨ तुम्हारे लिए... ✨</h2>

    <!-- 👇 यहाँ अपना प्यारा सा संदेश लिखो -->
    <div class="sub-text">
      तुम मेरी ज़िंदगी की <span class="highlight">खास</span> वजह हो 🥰<br />
      तुम्हारी मुस्कान मेरा दिन बना देती है 🌸<br />
      बस यही कहना था...<br />
      <span style="font-size:1.8rem;">💖 तुम बहुत खास हो 💖</span>
    </div>

    <!-- 👇 यह बटन surprise.html खोलेगा -->
    <a href="surprise.html" class="btn">🎁 सरप्राइज़ देखो 🎁</a>
  </div>

</body>
</html>
